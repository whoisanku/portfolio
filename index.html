  <link rel="preconnect" href="https://res.cloudinary.com">
  <link rel="preconnect" href="https://public.api.bsky.app" crossorigin>
  <meta

  />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Ankit Bhandari" />
  <meta
    property="og:description"
    content="Ankit loves designing and software development."
  />
  <meta
    property="og:image"
    content="https://res.cloudinary.com/dvnt65etc/image/upload/f_auto,q_auto/v1781422920/portfolio/og-image"
  />
  <meta
    property="og:image:secure_url"
    content="https://res.cloudinary.com/dvnt65etc/image/upload/f_auto,q_auto/v1781422920/portfolio/og-image"
  />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta
    property="og:image:alt"
    content="Ankit Bhandari portfolio thumbnail with profile photo and hero headline."
  />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Ankit Bhandari" />
  <meta
    name="twitter:description"
    content="Ankit loves designing and software development."
  />
  <meta
    name="twitter:image"
    content="https://res.cloudinary.com/dvnt65etc/image/upload/f_auto,q_auto/v1781422920/portfolio/og-image"
  />
  <meta
    name="twitter:image:alt"
    content="Ankit Bhandari portfolio thumbnail with profile photo and hero headline."
  />
  <meta name="twitter:creator" content="@whoisanku" />
  <meta name="theme-color" content="#f6f7f9" />
  <script>
    // Stamp the theme before first paint so there is no flash of the wrong
    // scheme: stored preference wins, else the OS scheme. src/lib/theme.ts
    // owns every later change.
    (function () {
      var stored = null;
      try { stored = localStorage.getItem("theme"); } catch (e) { /* privacy mode */ }
      var dark = stored === "dark" || (stored !== "light" &&
        window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", dark ? "#101216" : "#f6f7f9");
    })();
  </script>
  <script>
    // Start loading the Bluesky profile (avatar + display name) now, alongside
    // the app bundle, instead of after React mounts; src/lib/ownerProfile.ts
    // picks the request up. With a profile saved from an earlier visit the
    // avatar starts downloading (usually from cache) straight away; otherwise
    // it starts as soon as the profile arrives. The handle mirrors
    // OWNER_HANDLE in src/lib/config.ts, the storage key and avatar URL
    // mirror STORAGE_KEY and ownerAvatarSrc() in src/lib/ownerProfile.ts.
    (function () {
      var handle = "anku.bsky.social";
      var host = location.hostname;
      var optimize = host !== "localhost" && host !== "127.0.0.1" && host !== "[::1]";
      function avatarSrc(url) {
        return optimize ? "/_vercel/image?url=" + encodeURIComponent(url) + "&w=256&q=75" : url;
      }
      function preload(url) {
        if (url) new Image().src = avatarSrc(url);
      }
      var saved = null;
      try { saved = JSON.parse(localStorage.getItem("owner-profile:" + handle)); } catch (e) { /* privacy mode */ }
      if (saved && saved.avatar) preload(saved.avatar);
      window.__ownerProfileRequest = fetch(
        "https://public.api.bsky.app/xrpc/app.bsky.actor.getProfile?actor=" + handle
      )
        .then(function (res) { return res.ok ? res.json() : null; })
        .catch(function () { return null; })
        .then(function (profile) {
          if (profile && profile.avatar && (!saved || saved.avatar !== profile.avatar)) {
            preload(profile.avatar);
          }
          return profile;
        });
    })();
  </script>
  <title>Ankit Bhandari</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
